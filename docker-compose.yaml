services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/auth-service:/app

  rag-service:
    build: ./services/rag-service
    env_file: .env
    ports:
      - "8002:8002"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./services/rag-service:/app
      - ./knowledge:/knowledge
      - uploaded_files:/uploads

  generation-service:
    build: ./services/generation-service
    env_file: .env
    ports:
      - "8003:8003"
    depends_on:
      - rag-service
    volumes:
      - ./services/generation-service:/app
      - generated_files:/generated

  api-gateway:
    build: ./services/api-gateway
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - rag-service
      - generation-service
    volumes:
      - ./services/api-gateway:/app
      - uploaded_files:/uploads
      - generated_files:/generated

  frontend:
    build: ./frontend
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  qdrant_data:
  uploaded_files:
  generated_files: